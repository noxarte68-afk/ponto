<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ponto – Caverna do Dino</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1ece3;--sf:#fbf8f2;--tx:#2a2520;--mu:#7a6f62;--ln:#ddd3c3;--ac:#c2571a;--ac2:#4d6b3a;--ok:#4d6b3a;--bad:#a63a2b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1a16;--sf:#27231e;--tx:#efe7d8;--mu:#a19482;--ln:#3b352c;--ac:#e8803a;--ac2:#8fb06f;--ok:#8fb06f;--bad:#e0705f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1d1a16;--sf:#27231e;--tx:#efe7d8;--mu:#a19482;--ln:#3b352c;--ac:#e8803a;--ac2:#8fb06f;--ok:#8fb06f;--bad:#e0705f;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 "Bricolage Grotesque",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:26px;font-weight:800;margin:4px 0 0;letter-spacing:-.5px}
h2{font-size:18px;margin:0 0 8px}
.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.top{display:flex;gap:10px;align-items:end;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
nav{display:flex;gap:6px;margin-bottom:14px}
nav button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--sf);color:var(--tx);border-radius:10px;font:inherit;font-weight:600}
nav button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu);margin:8px 0 3px}
input,select{width:100%;padding:10px;border:1px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700;width:100%;margin-top:10px}
.btn.alt{background:var(--ac2)}.btn.ghost{background:transparent;color:var(--bad);border:1px solid var(--ln);width:auto;padding:6px 10px;margin:0;font-size:13px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.slot{border:1px solid var(--ln);border-radius:10px;padding:8px 4px;text-align:center;background:var(--bg)}
.slot small{display:block;color:var(--mu);font-size:11px}.slot b{font-size:17px}
.slot.next{border-color:var(--ac);box-shadow:0 0 0 2px var(--ac) inset}
.slot input{padding:4px;font-size:14px;margin-top:4px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{padding:6px 10px;border:1px solid var(--ln);border-radius:999px;background:var(--bg);color:var(--tx);font:inherit;font-size:13px}
.chip.on{background:var(--ac2);border-color:var(--ac2);color:#fff}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12px;color:var(--mu)}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 5px;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
pre{white-space:pre-wrap;font:13px/1.4 inherit;background:var(--bg);border:1px solid var(--ln);border-radius:10px;padding:10px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
#cupom{display:none}
@page{size:80mm auto;margin:2mm}
@media print{main{display:none}body{background:#fff}#cupom{display:block;width:72mm;color:#000;font:12px/1.4 monospace}#cupom hr{border:0;border-top:1px dashed #000}}
</style>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
</head>
<body>
<main>
<div class="top"><div><div class="sub" style="margin:0">Caverna do Dino</div><h1>Ponto</h1></div>
<div style="width:150px"><input type="month" id="mes" aria-label="Mês"></div></div>
<nav id="nav"></nav>
<div id="v"></div>
</main>
<div id="cupom"></div>
<script>
const PREV={e:"16:00",p:"17:00",r:"18:00",s:"23:00"};
const LAB={e:"Entrada",p:"Pausa",r:"Retorno",s:"Saída"};
const DIAS=["Dom","Seg","Ter","Qua","Qui","Sex","Sáb"];
const ZAP="5516988291300";
let S={emps:[],recs:{}},tab="ponto",sel=null;
try{const j=localStorage.getItem("cdd-ponto");if(j)S=JSON.parse(j)}catch(e){}
const TOL=10,EARLY=30;
let DB=null,CANEDIT=true,who=null;
const nowMin=()=>{const d=new Date();return d.getHours()*60+d.getMinutes()};
const limite=()=>mins(PREV.e)+TOL;
const hh=m=>pad(Math.floor(m/60))+":"+pad(m%60);
const isEmp=()=>location.hash==="#funcionario";
const loc=()=>{try{localStorage.setItem("cdd-ponto",JSON.stringify(S))}catch(e){}};
const save=()=>{loc();if(DB&&CANEDIT)DB.doc("cdd/emps").set({list:S.emps}).catch(()=>{})};
function saveRec(key){const a=key.split("|");S.recs[key]={...S.recs[key],emp:a[0],date:a[1]};loc();if(DB)DB.doc("recs/"+a[0]+"_"+a[1]).set(S.recs[key]).catch(()=>alert("Não foi possível salvar. Verifique sua permissão de acesso."))}
const redraw=()=>{const a=document.activeElement;if(!a||a.tagName!=="INPUT")draw()};
const FB={apiKey:"AIzaSyDgp9J69DbcrcMMsYSAYBwq8bXWsZFZSPs",authDomain:"ponto-ff6e2.firebaseapp.com",projectId:"ponto-ff6e2",storageBucket:"ponto-ff6e2.firebasestorage.app",messagingSenderId:"868519498533",appId:"1:868519498533:web:8fc5f2517f43e034abc0cc"};
const GESTOR_PIN="1234"; // troque pelo PIN do gestor
let gOk=false;
function gestor(){if($("gp").value===GESTOR_PIN){gOk=true;draw()}else alert("PIN incorreto.")}
async function initDb(){
 if(typeof firebase==="undefined"||String(FB.apiKey).startsWith("COLE"))return;
 try{firebase.initializeApp(FB);DB=firebase.firestore()}catch(e){console.error(e);return}
 DB.doc("cdd/emps").onSnapshot(s=>{if(s.exists){S.emps=JSON.parse(JSON.stringify(s.data().list||[]));loc()}else if(S.emps.length)save();redraw()},()=>{});
 DB.collection("recs").onSnapshot(q=>{const o={};q.docs.forEach(x=>{const v=x.data();o[v.emp+"|"+v.date]={...v}});S.recs=o;loc();redraw()},()=>{});
 draw();
}
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mins=t=>{const a=t.split(":");return +a[0]*60+ +a[1]};
const hm=m=>Math.floor(m/60)+"h"+pad(m%60);
const now=new Date();
$("mes").value=now.getFullYear()+"-"+pad(now.getMonth()+1);
const mesSel=()=>{const a=$("mes").value.split("-");return{y:+a[0],m:+a[1]-1}};
const diasDoMes=()=>{const{y,m}=mesSel();const n=new Date(y,m+1,0).getDate();return Array.from({length:n},(_,i)=>new Date(y,m,i+1))};
const folga=(emp,d)=>d.getDay()===emp.folga||(d.getDay()===0&&(emp.dom||[]).includes(iso(d)));
const prevMin=mins(PREV.p)-mins(PREV.e)+mins(PREV.s)-mins(PREV.r);
function feito(r){if(!r)return 0;let t=0;if(r.e&&r.p)t+=mins(r.p)-mins(r.e);if(r.r&&r.s)t+=mins(r.s)-mins(r.r);return Math.max(t,0)}
function stat(emp){const hoje=iso(now);let prev=0,fz=0,dt=0,fl=0,falt=0;
 diasDoMes().forEach(d=>{const k=iso(d);if(folga(emp,d)){fl++;return}prev+=prevMin;const r=S.recs[emp.id+"|"+k];
  if(r&&r.e){dt++;fz+=feito(r)}else if(k<hoje||(k===hoje&&nowMin()>limite()))falt++});
 return{prev,fz,dt,fl,falt}}
function nav(){$("nav").innerHTML=[["ponto","Ponto"],["func","Equipe"],["rel","Relatório"]].map(a=>`<button class="${tab===a[0]?"on":""}" onclick="tab='${a[0]}';draw()">${a[1]}</button>`).join("")}
function draw(){if(!isEmp()&&!gOk){$("mes").parentNode.style.display="none";$("nav").innerHTML="";$("v").innerHTML=`<div class="card"><h2>Acesso do gestor</h2><label>PIN do gestor</label><input id="gp" type="password" inputmode="numeric" autocomplete="off"><button class="btn" onclick="gestor()">Entrar</button></div>`;return}$("mes").parentNode.style.display=isEmp()?"none":"";if(isEmp()){$("nav").innerHTML="";$("v").innerHTML=vEmp();return}nav();$("v").innerHTML=tab==="ponto"?vPonto():tab==="func"?vFunc():vRel()}
function vEmp(){
 if(!S.emps.length)return `<div class="card"><h2>Ponto indisponível</h2><p class="sub">Nenhum funcionário cadastrado. Fale com o gestor.</p></div>`;
 const emp=S.emps.find(e=>e.id===who);
 if(!emp)return `<div class="card"><h2>Entrar</h2><label>Funcionário</label><select id="lu">${S.emps.map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join("")}</select><label>PIN</label><input id="lp" type="password" inputmode="numeric" maxlength="8" autocomplete="off"><button class="btn" onclick="login()">Entrar</button></div>`;
 const n=new Date(),key=emp.id+"|"+iso(n),r=S.recs[key]||{},cur=nowMin(),ini=mins(PREV.e),lim=limite();
 const nx=["e","p","r","s"].find(f=>!r[f]);let msg="",can=false;
 if(folga(emp,n))msg=`<p class="ok"><b>Hoje é sua folga.</b> Nenhuma marcação prevista.</p>`;
 else if(!r.e&&cur>lim)msg=`<p class="bad"><b>Falta injustificada.</b> O prazo para registrar a entrada terminou às ${hh(lim)}. Procure o gestor.</p>`;
 else if(!r.e&&cur<ini-EARLY)msg=`<p class="tag">O registro da entrada libera às ${hh(ini-EARLY)}.</p>`;
 else if(nx){can=true;if(!r.e)msg=`<p class="tag">Registre a entrada até ${hh(lim)}. Depois disso, será falta injustificada.</p>`}
 else msg=`<p class="ok"><b>Jornada completa.</b> Feito: ${hm(feito(r))}</p><button class="btn alt" onclick="imprimir('${key}')">Imprimir comprovante</button>`;
 return `<div class="card"><div class="row"><div><h2 style="margin:0">${esc(emp.nome)}</h2><div class="tag">${esc(emp.cargo)} · ${DIAS[n.getDay()]} ${pad(n.getDate())}/${pad(n.getMonth()+1)} · agora ${hh(cur)}</div></div><button class="btn ghost" style="color:var(--tx)" onclick="who=null;draw()">Sair</button></div>
 <div class="grid4" style="margin-top:12px">${["e","p","r","s"].map(f=>`<div class="slot ${can&&f===nx?"next":""}"><small>${LAB[f]}</small><b>${PREV[f]}</b><small>feito</small><b>${r[f]||"–"}</b></div>`).join("")}</div>
 ${msg}${can?`<button class="btn" onclick="bater('${key}','${nx}')">Registrar ${LAB[nx].toLowerCase()}</button>`:""}</div>`}
function login(){const e=S.emps.find(x=>x.id===$("lu").value);if(e&&String(e.pin||"")===$("lp").value.trim()){who=e.id;draw()}else alert("PIN incorreto.")}
function imprimir(key){const a=key.split("|"),emp=S.emps.find(e=>e.id===a[0]),r=S.recs[key];if(!emp||!r)return;
 $("cupom").innerHTML=`<div style="text-align:center"><b>CAVERNA DO DINO</b><br>Comprovante de ponto</div><hr>${esc(emp.nome)}<br>${esc(emp.cargo)}<br>Data: ${a[1].split("-").reverse().join("/")}<hr>${["e","p","r","s"].map(f=>LAB[f]+": prev "+PREV[f]+" real "+(r[f]||"--")).join("<br>")}<hr>Horas feitas: ${hm(feito(r))}<br>Emitido às ${hh(nowMin())}<br><br><br>____________________<br>Assinatura`;
 setTimeout(()=>{try{window.print()}catch(e){}},300)}
setInterval(()=>{if(isEmp()&&who)redraw()},30000);
function vPonto(){
 if(!S.emps.length)return `<div class="card"><h2>Nenhum funcionário</h2><p class="sub">Cadastre alguém na aba Equipe para começar.</p></div>`;
 if(!sel||!S.emps.find(e=>e.id===sel))sel=S.emps[0].id;
 const emp=S.emps.find(e=>e.id===sel),k=iso(now),key=emp.id+"|"+k,r=S.recs[key]||{};
 const nx=["e","p","r","s"].find(f=>!r[f]);
 const off=folga(emp,now);
 return `<div class="card"><label>Funcionário</label><select onchange="sel=this.value;draw()">${S.emps.map(e=>`<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.nome)} – ${esc(e.cargo)}</option>`).join("")}</select>
 <h2 style="margin-top:14px">Hoje, ${DIAS[now.getDay()]} ${pad(now.getDate())}/${pad(now.getMonth()+1)}</h2>
 ${off?`<p class="ok"><b>Dia de folga.</b> Nenhuma marcação prevista.</p>`:`
 <div class="grid4">${["e","p","r","s"].map(f=>`<div class="slot ${f===nx?"next":""}"><small>${LAB[f]}</small><b>${PREV[f]}</b><input type="time" value="${r[f]||""}" onchange="setP('${key}','${f}',this.value)" aria-label="${LAB[f]} real"></div>`).join("")}</div>
 <p class="tag">Em cima o horário previsto, embaixo o horário real.</p>
 ${nx?`<button class="btn" onclick="bater('${key}','${nx}')">Registrar ${LAB[nx].toLowerCase()} agora</button>`:`<p class="ok"><b>Jornada completa.</b> Feito: ${hm(feito(r))}</p>`}`}</div>`}
function bater(key,f){if(f==="e"&&nowMin()>limite()){alert("Prazo encerrado: falta injustificada.");draw();return}const t=new Date();S.recs[key]={...S.recs[key],[f]:pad(t.getHours())+":"+pad(t.getMinutes())};saveRec(key);draw();if(f==="s")imprimir(key)}
function setP(key,f,v){S.recs[key]={...S.recs[key],[f]:v};saveRec(key);draw()}
function vFunc(){
 const doms=diasDoMes().filter(d=>d.getDay()===0);
 return `<div class="card"><h2>Link do funcionário</h2><pre>${esc(location.origin+location.pathname)}#funcionario</pre><p class="tag">Envie este link aos funcionários. Eles entram com nome e PIN.</p></div>
 <div class="card"><h2>Novo funcionário</h2>
 <label>Nome</label><input id="fn" placeholder="Nome completo">
 <label>Cargo</label><input id="fc" placeholder="Ex.: Garçom, Cozinheiro, Caixa">
 <label>PIN de acesso (4 a 8 números)</label><input id="fp" inputmode="numeric" maxlength="8" placeholder="Ex.: 1234">
 <label>Folga semanal</label><select id="ff"><option value="-1">Sem folga fixa</option>${DIAS.map((d,i)=>`<option value="${i}">${d}</option>`).join("")}</select>
 <button class="btn" onclick="addEmp()">Cadastrar funcionário</button></div>
 ${S.emps.map(e=>`<div class="card"><div class="row"><div><b>${esc(e.nome)}</b><div class="tag">${esc(e.cargo)} · folga: ${e.folga>=0?DIAS[e.folga]:"nenhuma"} · PIN ${esc(e.pin||"")}</div></div><button class="btn ghost" onclick="delEmp('${e.id}')">Remover</button></div>
 <label>Domingos de folga neste mês</label><div class="chips">${doms.map(d=>`<button class="chip ${(e.dom||[]).includes(iso(d))?"on":""}" onclick="togDom('${e.id}','${iso(d)}')">${pad(d.getDate())}/${pad(d.getMonth()+1)}</button>`).join("")}</div></div>`).join("")}`}
function addEmp(){const n=$("fn").value.trim(),c=$("fc").value.trim();const pin=$("fp").value.trim();if(!n||!c||pin.length<4){alert("Preencha nome, cargo e um PIN de pelo menos 4 números.");return}
 S.emps.push({id:"e"+Date.now(),nome:n,cargo:c,pin:pin,folga:+$("ff").value,dom:[]});save();draw()}
function delEmp(id){if(confirm("Remover este funcionário?")){S.emps=S.emps.filter(e=>e.id!==id);save();draw()}}
function togDom(id,k){const e=S.emps.find(x=>x.id===id);e.dom=e.dom||[];const i=e.dom.indexOf(k);i>=0?e.dom.splice(i,1):e.dom.push(k);save();draw()}
function texto(){const{y,m}=mesSel();
 let t=`*Caverna do Dino – Fechamento ${pad(m+1)}/${y}*\nJornada prevista: ${PREV.e} entrada, ${PREV.p} pausa, ${PREV.r} retorno, ${PREV.s} saída.\n`;
 S.emps.forEach(e=>{const s=stat(e);t+=`\n*${e.nome}* (${e.cargo})\nDias trabalhados: ${s.dt}\nFolgas: ${s.fl}\nFaltas injustificadas: ${s.falt}\nHoras previstas: ${hm(s.prev)}\nHoras feitas: ${hm(s.fz)}\nSaldo: ${s.fz-s.prev<0?"-":"+"}${hm(Math.abs(s.fz-s.prev))}\n`});
 return t}
function vRel(){
 if(!S.emps.length)return `<div class="card"><h2>Sem dados</h2><p class="sub">Cadastre funcionários para gerar o fechamento.</p></div>`;
 const t=texto();
 return `<div class="card"><h2>Fechamento do mês</h2><div class="tw"><table><tr><th>Nome</th><th>Dias</th><th>Folgas</th><th>Falt. inj.</th><th>Previsto</th><th>Feito</th></tr>
 ${S.emps.map(e=>{const s=stat(e);return `<tr><td>${esc(e.nome)}</td><td>${s.dt}</td><td>${s.fl}</td><td class="${s.falt?"bad":""}">${s.falt}</td><td>${hm(s.prev)}</td><td>${hm(s.fz)}</td></tr>`}).join("")}</table></div></div>
 <div class="card"><h2>Mensagem</h2><pre>${esc(t)}</pre>
 <a href="https://wa.me/${ZAP}?text=${encodeURIComponent(t)}" target="_blank" rel="noopener"><button class="btn alt">Enviar para o WhatsApp (16) 98829-1300</button></a>
 <p class="tag">O WhatsApp abre com a mensagem pronta; é só tocar em enviar.</p></div>`}
$("mes").onchange=draw;window.addEventListener("hashchange",draw);draw();initDb();
</script>
</body>
</html>
